[package]
name = "facto-cli"
version = "0.4.6"
edition = "2021"
rust-version = "1.75"
description = "Facto CLI — DeFi-funded Agent payments via x402 protocol"
license = "MIT"
authors = ["Facto <dev@facto.to>"]
repository = "https://github.com/Facto-to/facto-cli"
homepage = "https://facto.xyz"
keywords = ["defi", "payments", "x402", "usdc", "agent"]
categories = ["command-line-utilities", "finance"]
exclude = [".claude/", ".git*", "SKILL.md"]

[[bin]]
name = "facto"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "6"
open = "5"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2.1.3"
